# Development stack: Postgres, Redis and MinIO, with the bucket created and the
# database migrated. Run the apps themselves with `pnpm dev`.
#
#   pnpm dev:up
#
# Not `docker compose up --wait`: that exits 1 as soon as a one-shot service
# finishes, even successfully, so `minio-init` and `migrate` are started
# separately. `pnpm dev:up` does both and stops on the first failure.
#
# Backing services only, skipping the migration image build:
#
#   docker compose up -d --wait postgres redis minio
#   docker compose run --rm minio-init
#
# Host ports default to the standard ones. If something already listens on them,
# put overrides in a root .env (POSTGRES_PORT, REDIS_PORT, MINIO_PORT,
# MINIO_CONSOLE_PORT) and point apps/api/.env at the same numbers.
#
name: share-note-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: share_note
      POSTGRES_PASSWORD: share_note
      POSTGRES_DB: share_note
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U share_note -d share_note']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: share_note
      MINIO_ROOT_PASSWORD: share_note_dev_secret
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 share_note share_note_dev_secret
        mc mb --ignore-existing local/share-note
        mc anonymous set none local/share-note
        echo "bucket ready"
    restart: 'no'

  # Applies migrations, then exits. Building it is what makes `docker compose
  # up` give a schema that matches the checkout; `pnpm --filter @share-note/api
  # migrate:dev` is the faster loop while changing the schema.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://share_note:share_note@postgres:5432/share_note?schema=public
    restart: 'no'

volumes:
  postgres-data:
  minio-data:
