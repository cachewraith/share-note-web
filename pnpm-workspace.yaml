packages:
  - apps/*
  - packages/*

# Dependencies that must build native/postinstall code. Everything else is
# blocked from running install scripts (supply-chain hardening, OWASP A03).
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# Packages with install scripts we deliberately refuse to run.
ignoredBuiltDependencies:
  - '@scarf/scarf'

# Single source of truth for every third-party version in the workspace.
catalog:
  # --- language + build ------------------------------------------------
  typescript: 5.9.3
  tsup: 8.5.1
  esbuild: 0.28.2
  tsx: 4.23.13
  tsc-alias: 1.9.5

  # --- lint / format ---------------------------------------------------
  eslint: 9.39.5
  typescript-eslint: 8.70.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  '@next/eslint-plugin-next': 16.3.5
  globals: 17.12.0
  prettier: 3.9.8

  # --- test ------------------------------------------------------------
  vitest: 5.0.1
  supertest: 7.2.2
  '@swc/core': 1.16.2
  unplugin-swc: 1.6.0

  # --- api -------------------------------------------------------------
  '@nestjs/common': 12.0.3
  '@nestjs/core': 12.0.3
  '@nestjs/platform-fastify': 12.0.3
  '@nestjs/swagger': 12.0.1
  '@nestjs/testing': 12.0.3
  '@fastify/helmet': 13.1.1
  '@fastify/multipart': 10.1.1
  '@aws-sdk/client-s3': 3.1136.0
  '@prisma/client': 7.10.0
  '@prisma/adapter-pg': 7.10.0
  prisma: 7.10.0
  pg: 8.23.0
  '@types/pg': 8.23.1
  dotenv: 18.0.1
  ioredis: 6.0.0
  nestjs-zod: 5.5.0
  'reflect-metadata': 0.2.2
  rxjs: 7.8.2

  # --- shared ----------------------------------------------------------
  zod: 4.6.5

  # --- web -------------------------------------------------------------
  next: 16.3.5
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  unified: 11.0.5
  remark-parse: 11.0.0
  remark-gfm: 4.0.1
  remark-rehype: 11.1.2
  rehype-sanitize: 6.0.0
  rehype-stringify: 10.0.1
  '@shikijs/rehype': 4.4.3
  shiki: 4.4.3
  'unist-util-visit': 5.1.0
  'hast-util-to-string': 3.0.1
  '@types/hast': 3.0.4
  '@types/mdast': 4.0.4
  '@types/unist': 3.0.3

  # --- plugin ----------------------------------------------------------
  obsidian: 1.13.1
  builtin-modules: 5.4.0

  # --- node types ------------------------------------------------------
  '@types/node': 22.20.4
  '@types/supertest': 6.0.3

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1136.0'
  - '@commitlint/cli@21.2.3'
  - '@commitlint/config-conventional@21.2.3'
  - '@commitlint/config-validator@21.2.3'
  - '@commitlint/ensure@21.2.3'
  - '@commitlint/format@21.2.3'
  - '@commitlint/is-ignored@21.2.3'
  - '@commitlint/lint@21.2.3'
  - '@commitlint/load@21.2.3'
  - '@commitlint/parse@21.2.3'
  - '@commitlint/read@21.2.3'
  - '@commitlint/resolve-extends@21.2.3'
  - '@commitlint/rules@21.2.3'
  - '@commitlint/types@21.2.3'
  - '@turbo/darwin-64@2.11.2'
  - '@turbo/darwin-arm64@2.11.2'
  - '@turbo/linux-64@2.11.2'
  - '@turbo/linux-arm64@2.11.2'
  - '@turbo/windows-64@2.11.2'
  - '@turbo/windows-arm64@2.11.2'
  - '@types/node@22.20.4'
  - turbo@2.11.2
  - dotenv@18.0.1

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  prisma: true
