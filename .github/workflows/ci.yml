name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TEST_DATABASE_URL: postgresql://share_note:share_note@localhost:5432/share_note?schema=public
      TEST_REDIS_URL: redis://localhost:6379
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_BUCKET: share-note
      TEST_S3_ACCESS_KEY_ID: share_note
      TEST_S3_SECRET_ACCESS_KEY: share_note_dev_secret

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same compose file developers use, so CI and local agree on versions.
      # `--wait` covers the long-running services only: it exits 1 when a
      # one-shot container finishes, even with code 0.
      - name: Start backing services
        run: |
          docker compose up -d --wait postgres redis minio
          docker compose run --rm minio-init

      - name: Apply migrations
        run: pnpm --filter @share-note/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Verify
        run: pnpm verify

      - name: Integration tests
        run: pnpm --filter @share-note/api test:integration

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
