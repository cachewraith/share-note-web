name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # While changesets are pending, this opens (or updates) the "Version
  # Packages" PR. Merging that PR is what bumps every version in lockstep and
  # writes the changelogs.
  version:
    name: Version packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          # No `publish`: nothing goes to a registry, and `changeset tag` would
          # write one tag per package. This product releases as a single tag,
          # created by the `tag` job below, because Obsidian requires the tag
          # to equal manifest.json's version exactly.
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Decides whether main is sitting on a version that has never been tagged,
  # which is true exactly once per merged "Version Packages" PR. Everything
  # below keys off this, so an ordinary commit to main does nothing.
  tag:
    name: Tag the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Is this version already released?
        id: check
        run: |
          version="$(node -p "require('./apps/plugin/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$version" = "0.0.0" ]; then
            echo "Still at 0.0.0; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check every package agrees on the version
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          fail=0
          for file in apps/api/package.json apps/web/package.json \
                      apps/plugin/package.json packages/contracts/package.json \
                      manifest.json apps/plugin/manifest.json; do
            found="$(node -p "require('./$file').version")"
            if [ "$found" != "$VERSION" ]; then
              echo "$file is $found, expected $VERSION" >&2
              fail=1
            fi
          done
          if ! node -p "require('./versions.json')['$VERSION']" >/dev/null 2>&1; then
            echo "versions.json has no entry for $VERSION" >&2
            fail=1
          fi
          [ "$fail" -eq 0 ] || { echo "Run pnpm sync-plugin-manifest." >&2; exit 1; }

      - name: Create the tag
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

  # The plugin release: Obsidian installs main.js, manifest.json and styles.css
  # from the GitHub Release assets.
  plugin:
    name: Plugin release assets
    needs: tag
    if: needs.tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.version }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Through turbo, not `pnpm --filter ... build`: the plugin's build is a
      # bare esbuild call, so it needs @share-note/contracts built first and
      # only turbo knows that from the task graph.
      - run: pnpm exec turbo run build --filter @share-note/plugin

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file <(node scripts/release-notes.mjs "$VERSION") \
            apps/plugin/main.js \
            apps/plugin/manifest.json \
            apps/plugin/styles.css

  # The server images, built on native runners rather than under QEMU.
  #
  # Emulated arm64 killed this the first time: `npm install` in the migrate
  # image died with "qemu: uncaught target signal 4 (Illegal instruction)".
  # GitHub's arm64 runners are free for public repositories, and building
  # natively is both reliable and much faster. Each job pushes an untagged
  # image by digest; the merge job below joins them into one multi-arch tag.
  images:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: tag
    if: needs.tag.outputs.release == 'true'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: share-note-api, dockerfile: apps/api/Dockerfile, target: runtime }
          - { name: share-note-api-migrate, dockerfile: apps/api/Dockerfile, target: migrate }
          - { name: share-note-web, dockerfile: apps/web/Dockerfile, target: runtime }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.version }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          provenance: true
          sbom: true

      # The filename is the bare digest; the merge job turns each back into a
      # full reference. Stripping happens in bash - GitHub expressions have no
      # parameter expansion.
      - name: Record the digest
        run: |
          digest="${{ steps.build.outputs.digest }}"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # Joins the per-architecture images into one tag people can pull.
  manifests:
    name: Publish ${{ matrix.image }} manifest
    needs: [tag, images]
    if: needs.tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [share-note-api, share-note-api-migrate, share-note-web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          cd /tmp/digests
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Show what was published
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
