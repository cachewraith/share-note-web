name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # While changesets are pending, this opens (or updates) the "Version
  # Packages" PR. Merging that PR is what bumps every version in lockstep and
  # writes the changelogs.
  version:
    name: Version packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          # No `publish`: nothing goes to a registry, and `changeset tag` would
          # write one tag per package. This product releases as a single tag,
          # created by the `tag` job below, because Obsidian requires the tag
          # to equal manifest.json's version exactly.
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Decides whether main is sitting on a version that has never been tagged,
  # which is true exactly once per merged "Version Packages" PR. Everything
  # below keys off this, so an ordinary commit to main does nothing.
  tag:
    name: Tag the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Is this version already released?
        id: check
        run: |
          version="$(node -p "require('./apps/plugin/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$version" = "0.0.0" ]; then
            echo "Still at 0.0.0; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check every package agrees on the version
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          fail=0
          for file in apps/api/package.json apps/web/package.json \
                      apps/plugin/package.json packages/contracts/package.json \
                      manifest.json apps/plugin/manifest.json; do
            found="$(node -p "require('./$file').version")"
            if [ "$found" != "$VERSION" ]; then
              echo "$file is $found, expected $VERSION" >&2
              fail=1
            fi
          done
          if ! node -p "require('./versions.json')['$VERSION']" >/dev/null 2>&1; then
            echo "versions.json has no entry for $VERSION" >&2
            fail=1
          fi
          [ "$fail" -eq 0 ] || { echo "Run pnpm sync-plugin-manifest." >&2; exit 1; }

      - name: Create the tag
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

  # The plugin release: Obsidian installs main.js, manifest.json and styles.css
  # from the GitHub Release assets.
  plugin:
    name: Plugin release assets
    needs: tag
    if: needs.tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.version }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @share-note/plugin build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file <(node scripts/release-notes.mjs "$VERSION") \
            apps/plugin/main.js \
            apps/plugin/manifest.json \
            apps/plugin/styles.css

  # The server images. Built for amd64 and arm64 so a small ARM box can run them.
  images:
    name: Push ${{ matrix.image }} image
    needs: tag
    if: needs.tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: share-note-api
            dockerfile: apps/api/Dockerfile
            target: runtime
          - image: share-note-api-migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
          - image: share-note-web
            dockerfile: apps/web/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.version }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true
